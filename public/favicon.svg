<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Obsidian Canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151B"/>
      <stop offset="50%" stop-color="#0E0F14"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Liquid Chrome Silver Mercury Gradient -->
    <linearGradient id="mercurySilver" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="65%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Specular Highlight Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ice-Blue Refraction Glow -->
    <radialGradient id="iceCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#8CB4FF" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07070A" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with Hairline Rim -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="136" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Liquid Mercury Droplet Silhouette -->
  <g filter="url(#softGlow)">
    <!-- Droplet Body -->
    <path
      d="M256 90 C256 90 148 244 148 320 C148 382 196 430 256 430 C316 430 364 382 364 320 C364 244 256 90 256 90 Z"
      fill="url(#mercurySilver)"
    />

    <!-- Architectural M Embossed on Droplet Surface -->
    <path
      d="M208 360 L208 260 L256 312 L304 260 L304 360"
      stroke="#07070A"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Specular Light Reflection -->
    <ellipse
      cx="220"
      cy="230"
      rx="24"
      ry="50"
      transform="rotate(-28 220 230)"
      fill="url(#sheenGrad)"
    />

    <!-- Ice Refraction Light Dot -->
    <circle
      cx="304"
      cy="360"
      r="10"
      fill="#8CB4FF"
    />
  </g>
</svg>
