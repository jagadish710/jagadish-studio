<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="50%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="40%" stop-color="#E6C687"/>
      <stop offset="100%" stop-color="#B89344"/>
    </linearGradient>

    <!-- Amber Accent Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="132" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Logo Mark -->
  <g filter="url(#glow)">
    <!-- Architectural M -->
    <path
      d="M136 380 L136 156 C136 145 145 136 156 136 L174 136 C183 136 191 141 195 149 L256 270 L317 149 C321 141 329 136 338 136 L356 136 C367 136 376 145 376 156 L376 380"
      stroke="url(#goldGrad)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Signature Q loop sweeping underneath and launching upward -->
    <path
      d="M216 290 C186 312 182 360 216 386 C250 406 296 400 320 370 C344 340 374 340 400 376 L424 402"
      stroke="url(#accentGrad)"
      stroke-width="26"
      stroke-linecap="round"
    />

    <!-- Apex Dot -->
    <circle
      cx="424"
      cy="402"
      r="22"
      fill="url(#accentGrad)"
    />
  </g>
</svg>
