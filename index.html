    <!-- Google Analytics 4 (GA4) — deferred so gtag never blocks first paint
         or competes with the hero for the main thread on mobile -->
    <script>
      (function () {
        var loaded = false;
        function loadGA() {
          if (loaded) return;
          loaded = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-D2E9NGZ40Q');
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-D2E9NGZ40Q';
          document.head.appendChild(s);
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (e) {
          window.addEventListener(e, loadGA, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) requestIdleCallback(loadGA, { timeout: 3000 });
          else setTimeout(loadGA, 3000);
        });
      })();
    </script>
