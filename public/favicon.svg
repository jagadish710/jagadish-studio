<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1824"/>
      <stop offset="50%" stop-color="#121118"/>
      <stop offset="100%" stop-color="#0A090E"/>
    </linearGradient>

    <!-- Outer Rim Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="45%" stop-color="#F5D77F"/>
      <stop offset="85%" stop-color="#FFF2B2"/>
      <stop offset="100%" stop-color="#E6C687"/>
    </linearGradient>

    <!-- Upward Arrow & Apex Emerald Gradient (Optimism & Energy) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Spine Royal Violet / Electric Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Logo Mark Group -->
  <g filter="url(#glow)">
    <!-- 1. Gold Base Arc of the "J" -->
    <path d="M156 296 C156 368 214 416 288 416 C348 416 388 382 408 334 C412 324 404 314 394 314 C386 314 378 320 372 328 C354 362 324 384 286 384 C232 384 190 348 190 296 L190 270 C190 262 182 256 174 256 L156 256 Z" 
          fill="url(#goldGrad)"/>

    <!-- 2. Royal Purple Core Spine -->
    <path d="M196 296 C196 352 240 384 290 384 C330 384 360 364 374 336 L374 212 L308 212 C298 212 292 202 298 194 L378 98 C382 92 392 92 396 98 L404 108 L404 336 C404 394 354 418 290 418 C226 418 162 380 162 296 L162 284 L196 284 Z" 
          fill="url(#purpleGrad)"/>

    <!-- 3. Ascending Apex & Dynamic Arrow Peak (Optimism & Forward Momentum) -->
    <path d="M298 194 L378 98 C384 90 396 90 402 98 L452 158 C458 166 452 176 442 176 L404 176 L404 320 C404 326 398 332 392 332 L376 332 C370 332 364 326 364 320 L364 212 L308 212 C298 212 292 202 298 194 Z" 
          fill="url(#emeraldGrad)"/>

    <!-- 4. Luminous Star Sparkle at Apex -->
    <polygon points="390,70 394,84 408,88 394,92 390,106 386,92 372,88 386,84" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>